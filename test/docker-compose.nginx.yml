services:

  mariadb:
    image: docker.io/mariadb:11.2.2
    container_name: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=${BATS_MARIADB_ROOT_DB_PASSWORD}
      - MARIADB_USER=${BATS_MARIADB_DB_USER}
      - MARIADB_PASSWORD=${BATS_MARIADB_DB_PASSWORD}
      - MARIADB_DATABASE=${BATS_MARIADB_DB_NAME}
      - DEBUG=false
    networks:
      - default
    mem_limit: 512m
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 5
      test: mariadb-admin ping -h 127.0.0.1 -u $$MARIADB_USER --password=$$MARIADB_PASSWORD

  php:
    image: ${BATS_PHP_DOCKER_IMAGE_NAME}
    container_name: php
    user: "${BATS_UID}"
    ports:
      - 9000:9000
    environment: 
      - PHP_FPM_MAX_CHILDREN=${BATS_PHP_FPM_MAX_CHILDREN}
      - PHP_FPM_REQUEST_MAX_MEMORY_IN_MEGABYTES=${BATS_PHP_FPM_REQUEST_MAX_MEMORY_IN_MEGABYTES}
      - CONTAINER_HEAP_PERCENT=${BATS_CONTAINER_HEAP_PERCENT}
      - DB_DRIVER=${BATS_MARIADB_DB_DRIVER}
      - DB_HOST=${BATS_MARIADB_DB_HOST}
      - DB_PORT=${BATS_MARIADB_DB_PORT}
      - DB_USER=${BATS_MARIADB_DB_USER}
      - DB_PASSWORD=${BATS_MARIADB_DB_PASSWORD}
      - DB_NAME=${BATS_MARIADB_DB_NAME}
      - VARNISH_ENABLED=${BATS_VARNISH_ENABLED}
    command: ["/usr/bin/supervisord","-c","/etc/supervisord.conf"]
    volumes:
      - app_bin:/app/bin/container-entrypoint.d
      - app_var:/app/var
      - app_etc:/app/etc
      - app_tmp:/app/tmp
      - app_cfg:/app/config/nginx/sites-enabled
      - app_src:/app/src
    networks:
      - default
    mem_limit: 512m
    read_only: true

volumes:
  app_bin:
    external:
      name: ${BATS_APP_BIN_VOLUME_NAME}
  app_var:
    external:
      name: ${BATS_APP_VAR_VOLUME_NAME}
  app_etc:
    external:
      name: ${BATS_APP_ETC_VOLUME_NAME}
  app_tmp:
    external:
      name: ${BATS_APP_TMP_VOLUME_NAME}
  app_cfg:
    external:
      name: ${BATS_APP_CFG_VOLUME_NAME}
  app_src:
    external:
      name: ${BATS_APP_SRC_VOLUME_NAME}

networks:
  default:
    name: ${BATS_CONTAINER_NETWORK_NAME}
    external: true
